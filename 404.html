body {

  min-height: 100vh;
  display: flex;

  max-width: 480px;

.error-code {

  font-weight: 800;

  line-height: 1;
  margin-bottom: 1rem;

}

h1 {
  font-size: 1.5rem;
  color: var(--text-bright);
  font-weight: 600;
  margin-bottom: 0.75rem;
}
p {

  font-size: 0.95rem;

}
.links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  justify-content: center;
}
.links a {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.6rem 1.2rem;
  border-radius: var(--radius);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  transition: all 0.2s ease;
}
.links a:hover {
  border-color: var(--accent);
  color: var(--text-bright);
  background: var(--accent-dim);
}
.links a.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.links a.primary:hover {
  background: #3b82f6;
  border-color: #3b82f6;
}
.footer {
  margin-top: 3rem;
  color: var(--text-dim);
  font-size: 0.8rem;
}
.footer a {

  text-decoration: none;
